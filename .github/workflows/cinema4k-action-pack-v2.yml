name: Build 15 cinema-4K anime animation frames
on:
  push:
    branches: [cinema-4k-action-pack-v2]
    paths: ['.github/workflows/cinema4k-action-pack-v2.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare 4K renderer
        run: python -m pip install --quiet "Pillow>=10,<12"
      - name: Generate 15 distinct 3840x2160 battle frames
        run: python tools/build_cinematic_4k.py
      - name: Test entire game and 4K scene pack
        run: |
          node --check saiyan.js
          node tests/smoke-test.cjs
      - name: Commit rendered images safely
        run: |
          git config user.name "dbna-4k-renderer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/4k/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build 15 cinematic 4K battle frames"
          git fetch origin cinema-4k-action-pack-v2
          git rebase origin/cinema-4k-action-pack-v2
          git push origin HEAD:cinema-4k-action-pack-v2
