name: Build real 3840x2160 game-frame pack
on:
  push:
    branches: [cinematic-4k-attack-pack]
    paths:
      - '.github/workflows/create-4k-scenes-once.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow game asset compiler
        run: python -m pip install --quiet "pillow>=10.4,<12"
      - name: Build five cinematic 4K images
        run: python tools/build_cinematic_4k.py
      - name: Verify output pixel dimensions and compression
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names=["battle","dash","charge","beam","impact"]
          for name in names:
              p=Path(f"assets/4k/{name}-3840x2160.webp")
              with Image.open(p) as img:
                  assert img.size==(3840,2160), f"{name}: {img.size}"
                  img.verify()
              assert p.stat().st_size>60000
              print("PASS 4K",p,p.stat().st_size)
          PY
      - name: Commit game images to candidate branch
        run: |
          git config user.name "dbna-art-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/4k
          git commit -m "Create five tested 4K cinematic game scenes" || exit 0
          git fetch origin cinematic-4k-attack-pack
          git rebase origin/cinematic-4k-attack-pack
          git push origin HEAD:cinematic-4k-attack-pack
