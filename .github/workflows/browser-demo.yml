name: Deploy browser demo

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'saiyan.js'
      - 'saiyan.css'
      - 'visual-upgrade.css'
      - 'cinematic-0.8.css'
      - 'assets/**'
      - 'reborn/**'
      - 'sw.js'
      - '.github/workflows/browser-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static demo
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for file in saiyan.js saiyan.css visual-upgrade.css cinematic-0.8.css; do
            test -s "$file"
            cp "$file" "_site/$file"
          done
          if test -d assets; then cp -R assets _site/assets; fi
          test -s reborn/index.html
          test -s reborn/engine.js
          test -s reborn/assets/earth-4k.svg
          cp -R reborn _site/reborn
          for file in manifest.webmanifest icon.svg sw.js; do
            if test -f "$file"; then cp "$file" "_site/$file"; fi
          done
          test -s _site/index.html
      - name: Verify Reborn full engine and map
        run: node reborn/tests/smoke.cjs
      - name: Verify published engine and assets
        run: |
          node --check saiyan.js
          node tests/smoke-test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
