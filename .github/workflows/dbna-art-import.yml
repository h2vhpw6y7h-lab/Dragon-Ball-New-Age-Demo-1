name: Import original battle artwork once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dbna-art-import.yml']
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download prepared original anime illustrations
        env:
          BATTLE_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:128/quality:100/uri:ifs%3A%2F%2FM%2F272eb14c-f7ab-4949-b2b5-8b612adc0464/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAONaRcSHvSNQw6EH2ujdOzv5qaJSStyl5Yxu6GhNPkJ8&exp=1793071135&osig=AAAAAAAAAAAAAAAAAAAAAJxQKBJK91EkssGXuXrxR2F19pyyjkZjVbOLO0weANO2&signer=media-rpc&token=AAIAAU0AJDI3MmViMTRjLWY3YWItNDk0OS1iMmI1LThiNjEyYWRjMDQ2NAAAAAABoXteORjtM8TJT8ITEvCbDY0OI7CrsqN2_BYmvM1r9CFEZ3N_Tg&x-canva-quality=thumbnail'
          KI_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:128/quality:100/uri:ifs%3A%2F%2FM%2F0ea93b71-97b8-49dd-9361-25dc2accb324/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPopx4QzkTMYnOjqjDmc4tNCQwXmxj81VwXASG5dsnUp&exp=1793071077&osig=AAAAAAAAAAAAAAAAAAAAALzGZlgQQEnoN_go7VAJwMgLYKiWMFHDCwRAx_qwNAFa&signer=media-rpc&token=AAIAAU0AJDBlYTkzYjcxLTk3YjgtNDlkZC05MzYxLTI1ZGMyYWNjYjMyNAAAAAABoXtdVohvbOpc55XUV67CtkXVrLZ471IBQTLCS8braaHSQWzW4w&x-canva-quality=thumbnail'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 - <<'PY'
          import urllib.request, os, struct
          for kind,base in [('battle',os.environ['BATTLE_URL']),('ki',os.environ['KI_URL'])]:
              hi=base.replace('height:128','height:588').replace('width:200','width:913')
              urls=[hi,base]
              chosen=None
              for j,url in enumerate(urls):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'DBNA-GitHub-Assets/1.0'}),timeout=30) as response:
                          buf=response.read()
                      if buf[:8]!=b'\x89PNG\r\n\x1a\n': raise Exception('Not PNG')
                      w,h=struct.unpack('>II',buf[16:24])
                      if w<100 or h<70: raise Exception('Image too small')
                      chosen=(buf,w,h)
                      print(f'{kind}: candidate={j} width={w} height={h} bytes={len(buf)}')
                      break
                  except Exception as e: print(f'{kind}: candidate={j} failed ({type(e).__name__})')
              if not chosen: raise RuntimeError('Cannot import '+kind)
              data,w,h=chosen
              with open(f'assets/anime-scene-{kind}-v1.png','wb') as f:f.write(data)
          PY
      - name: Commit binary art into GitHub repository
        shell: bash
        run: |
          git config user.name "dbna-art-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/anime-scene-battle-v1.png assets/anime-scene-ki-v1.png
          git commit -m "Add original raster anime battle and Ki cinematic artwork"
          git push origin HEAD:main
