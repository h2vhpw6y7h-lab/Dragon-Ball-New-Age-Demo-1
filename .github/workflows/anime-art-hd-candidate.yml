name: Render candidate HD anime art safely
on:
  push:
    branches: [graphics-hd-safe-pass]
    paths:
      - '.github/workflows/anime-art-hd-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upscale-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install image enhancement dependencies
        run: |
          python -m pip install --quiet "opencv-contrib-python-headless==4.10.0.84" "numpy<2"
          mkdir -p models
          curl -fLsS --retry 3 --max-time 45 -o models/FSRCNN_x4.pb https://raw.githubusercontent.com/Saafke/FSRCNN_Tensorflow/master/models/FSRCNN_x4.pb
          test "$(stat -c%s models/FSRCNN_x4.pb)" -gt 30000
      - name: AI x4 anime artwork super-resolution
        run: python tools/upscale_anime_art.py
      - name: Validate generated art size and runtime
        run: |
          python - <<'PY'
          import cv2
          from pathlib import Path
          for name in ['battle','ki']:
              p=Path('assets/anime-scene-'+name+'-hd.webp')
              assert p.exists() and p.stat().st_size>50000
              arr=cv2.imread(str(p))
              assert arr is not None and arr.shape[:2]==(592,920)
              print('HD verified:',p,arr.shape)
          PY
          node --check saiyan.js
          node tests/smoke-test.cjs
      - name: Save HD candidates to branch only
        run: |
          git config user.name "dbna-graphics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/anime-scene-battle-hd.webp assets/anime-scene-ki-hd.webp
          git commit -m "Add candidate AI-upscaled anime scenes (920x592)" || exit 0
          git fetch origin graphics-hd-safe-pass
          git rebase origin/graphics-hd-safe-pass
          git push origin HEAD:graphics-hd-safe-pass
