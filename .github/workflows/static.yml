name: Validate game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: JavaScript, assets and gameplay smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check saiyan.js
          node --check tests/smoke-test.cjs
      - name: Validate map, menus, battle, artwork and save migration
        run: node tests/smoke-test.cjs
      - name: Validate SVG source files
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for file in pathlib.Path("assets").glob("*.svg"):
              ET.parse(file)
              print("SVG OK:", file)
          PY
