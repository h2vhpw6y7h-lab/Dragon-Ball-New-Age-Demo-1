name: DBNA morning art and gameplay audit
on:
  workflow_dispatch:
  schedule:
    # 27 October 2026: 04:10–10:10 Europe/Warsaw (CET / UTC+1).
    # GitHub scheduled jobs can start late. Years other than 2026 are skipped below.
    - cron: '10 3-9 27 10 *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Gate scheduled work to 2026-10-27 only
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(date -u +%F)" == "2026-10-27" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - name: Verify source and all 13 illustrated character assets
        if: steps.gate.outputs.run == 'true'
        run: |
          node --check saiyan.js
          node tests/smoke-test.cjs
          node - <<'JS'
          const fs=require('fs'), assert=require('assert/strict');
          const src=fs.readFileSync('saiyan.js','utf8');
          const actors=['hero','ribbon','bandit','pig','martial','drone','scout','sentry','saiba','saiba-boss','nappa','vegeta','roshi'];
          for(const actor of actors){
            const p='assets/characters/'+actor+'.svg';
            const svg=fs.readFileSync(p,'utf8');
            assert(svg.includes('<svg')&&svg.includes('<path')&&svg.includes('Q'),p+' not an organic scalable character');
          }
          assert(src.includes('MOTION_MICROFRAMES=100'),'100-step motion track missing');
          assert(!src.includes('ENEMIES.bandit.art=originalEnemy'),'geometric enemy fallback returned');
          console.log('PASS: 13 characters, 100-step motion, no old boxy enemy assignment');
          JS
      - name: Report check result and commit
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          {
            echo '## DRAGON BALL NEW AGE — morning verification'
            echo
            echo "- UTC: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Art format: scalable anime-character SVG, 13 distinct characters"
            echo "- Motion: 100 computed pose steps per cinematic attack, not 100 original drawings"
            echo "- Validation: see workflow status and log"
          } >> "$GITHUB_STEP_SUMMARY"
