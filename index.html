s:50%;background:#c6d6bb;box-shadow:0 0 0 6px #d5e5c422}.fighter{position:absolute;bottom:30px;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(3px 4px 1px #24303c);transition:all .25s}.fighter.goku{left:15%}.fighter.frieza{right:15%}.head{width:37px;height:37px;background:#e9aa79;border:3px solid #1b2433;border-radius:43%}.hair{height:27px;width:45px;background:#19202b;clip-path:polygon(0 100%,14% 20%,35% 52%,49% 0,67% 49%,95% 20%,100% 100%);margin-bottom:-5px}.body{width:48px;height:65px;background:#dc7d31;border:3px solid #192434;border-radius:10px 10px 14px 14px}.legs{height:40px;width:40px;border-left:14px solid #d97934;border-right:14px solid #d97934}.frieza .head{background:#f1e9e9;border-top:12px solid #8553a4}.frieza .body{background:#f1e9e9;border-top:19px solid #8b5ca7}.frieza .legs{border-color:#e7e3e9}.beam{position:absolute;top:115px;left:25%;width:55%;height:27px;background:#b3efff;border:5px solid #42aaf0;border-radius:50%;box-shadow:0 0 15px #8be4ff;transform:rotate(-9deg)}.impact{position:absolute;right:11%;top:75px;font-size:100px;color:#ffe5a4;text-shadow:0 0 20px #ff8229}.speech{background:#0a1429dd;border-left:4px solid #eebd51;padding:10px;border-radius:8px;min-height:48px;margin-top:9px;font-size:14px}.muted{color:#b8c8d7;font-size:12px}.nav{display:flex;gap:7px;overflow:auto;margin:8px 0}.nav button{white-space:nowrap;padding:9px 12px;border-radius:9px;border:1px solid #516780;background:#172c43;color:white}.nav .on{background:#e7a72d;color:#172032}.log{max-height:125px;overflow:auto;font-size:12px;line-height:1.6}.skill{padding:11px;border-bottom:1px solid #43546a}.locked{opacity:.55}.pill{display:inline-block;background:#294864;border-radius:30px;padding:4px 9px;font-size:11px;margin:3px}.hide{display:none}.center{text-align:center}.big{font-size:40px}.flash{animation:flash .25s 2}@keyframes flash{50%{filter:brightness(2)}}@media(min-width:600px){.scene{height:340px}.fighter{transform:scale(1.3);transform-origin:bot :root{--gold:#ffc65b;--edge:#57718b}
body{background:radial-gradient(ellipse at 15% 15%,#183d54 0%,#101b32 45%,#080d1c 100%)}

.scene:after{content:"NAMEK • SEKTOR 07";position:absolute;top:10px;left:12px;letter-spacing:2px;font-size:10px;font-weight:800;color:#e5fff2;background:#102c3eaa;padding:5px 8px;border-radius:5px}

.battle-stage,.battle-command{min-width:0}

 .orientation-note{display:block;padding:9px 12px;border:1px solid #a9894a;background:#372b20;color:#ffdf98;border-radius:9px;font-size:12px;margin:7px 0}
 .battle-layout,.scene-layout{display:block}
 .battle-stage .scene,.scene-layout .scene{height:255px}
}

 #app{padding:5px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left))}

</style></head><body><main id="app"><section class="panel" style="margin-top:24px;text-align:center"><h1>DRAGON BALL NEW AGE</h1><h2>PROLOG: PLANETA NAMEK</h2><p>Uruchamianie gry…</p><p class="muted">Jeśli ekran nie załaduje się, otwórz stronę bezpośrednio w Safari i odśwież.</p></section></main><script>
const A=document.getElementById('app');
const TECH=[{id:'punch',name:'Szybkie ciosy',ki:0,power:130,hits:3,frames:['Goku przyjmuje pozycję bojową.','Doskok! Pierwszy cios trafia Friezę.','Błyskawiczna seria trzech uderzeń!','Frieza cofa się i zaciska pięści.']},{id:'meteor',name:'Meteor Combo',ki:22,power:290,hits:7,frames:['Goku: „Spróbuj to zatrzymać!”','Goku znika i pojawia się za Friezą.','Seria pięści i kopnięć rozcina powietrze!','Potężne uderzenie wyrzuca Friezę w skały.','Frieza przebija skalną ścianę!','Goku doskakuje z góry.','METEOR SMASH! Potężny finał!']},{id:'kame',name:'Kamehameha',ki:32,power:390,hits:1,frames:['Goku: „Ka...”','Niebieskie KI skupia się między dłońmi.','„Me... Ha... Me...”','„HAAAA!”','Fala energii przecina dolinę Namek!','Frieza próbuje odeprzeć promień!','Eksplozja wśród skał!']},{id:'ki',name:'Deszcz pocisków KI',ki:16,power:185,hits:6,frames:['Goku wyskakuje wysoko ponad arenę.','„Zobacz, czy za tym nadążysz!”','Pierwsze pociski KI lecą w stronę Friezy.','Sześć błyskawicznych eksplozji!','Dym zasłania przeciwnika.']},{id:'kaioken',name:'Kaioken x2',ki:20,power:0,hits:0,frames:['Goku zaciska pięści.','„KAIOKEN!”','Czerwona aura otacza wojownika.','Moc Goku rośnie na trzy kolejne ataki!']}];
let s={screen:'home',hp:1200,maxHp:1200,ki:100,maxKi:100,enemy:1600,maxEnemy:1600,level:1,xp:0,sp:0,atk:0,def:0,kai:0,turn:1,log:[],quests:[false,false,false],scene:null};
try{const old=JSON.parse(localStorage.getItem('dbna-save'));if(old)s={...s,...old,scene:null,screen:'home'}}catch(e){}
function save(){localStorage.setItem('dbna-save',JSON.stringify({...s,scene:null,screen:'home'}))}
function el(x){A.innerHTML=x}function btn(label,fn,primary=false,disabled=false){return '<button class="btn '+(primary?'primary':'')+'" '+(disabled?'disabled':'')+' onclick="'+fn+'">'+label+'</button>'}
function top(title){return '<div class="top"><div><div class="tag">DRAGON BALL NEW AGE • PROLOG v0.1</div><h1>'+title+'</h1></div><span style="font-size:27px">🐉</span></div>'}
function nav(){return '<div class="nav">'+[['home','Start'],['world','Namek'],['battle','Walka'],['skills','Rozwój'],['quests','Questy']].map(([k,v])=>'<button class="'+(s.screen===k?'on':'')+'" onclick="go(\''+k+'\')">'+v+'</button>').join('')+'</div>'}
function go(k){s.screen=k;render()}
function reset(){s={...s,hp:1200,ki:100,enemy:1600,kai:0,turn:1,scene:null,log:['Rozpoczyna się starcie na Namek.']};go('battle')}
function bars(){return '<div class="stats"><div><strong>GOKU • LV '+s.level+'</strong>HP '+s.hp+'/'+s.maxHp+'<div class="bar"><div class="fill" style="width:'+(s.hp/s.maxHp*100)+'%"></div></div>KI '+s.ki+'/'+s.maxKi+'<div class="bar"><div class="fill ki" style="width:'+(s.ki/s.maxKi*100)+'%"></div></div></div><div><strong>FRIEZA</strong>HP '+s.enemy+'/'+s.maxEnemy+'<div class="bar"><div class="fill" style="width:'+(s.enemy/s.maxEnemy*100)+'%"></div></div><span class="muted">Tura '+s.turn+(s.kai?' • KAIOKEN '+s.kai:'')+'</span></div></div>'}
function arena(type=''){return '<div class="scene '+(type==='impact'?'flash':'')+'"><div class="moon"></div><div class="fighter goku"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="legs"></div></div><div class="fighter frieza"><div class="head"></div><div class="body"></div><div class="legs"></div></div>'+(type==='beam'?'<div class="beam"></div>':'')+(type==='impact'?'<div class="impact">✹</div>':'')+'</div>'}
function render(){if(s.screen==='home'){el(top('DRAGON BALL NEW AGE')+'<div class="panel center"><div class="big">🌌 🐉</div><h2>PROLOG: PLANETA NAMEK</h2><p>Goku przybywa na Namek. Frieza czeka wśród skał. Czy zdołasz wygrać?</p>'+btn('▶ NOWA WALKA','reset()',true)+ ' '+btn('Kontynuuj przygodę','go(\'world\')')+'</div>'+nav()+'<p class="muted">Wersja demonstracyjna. Zapis lokalny na urządzeniu.</p>');return}
if(s.screen==='battle'){el(top('Walka • Namek')+nav()+'<div class="orientation-note">↻ Obróć iPhone poziomo — układ walki jest zaprojektowany do trybu landscape.</div>'+'<div class="panel">'+bars()+'</div>'+'<div class="battle-layout"><section class="battle-stage">'+arena()+'<div class="speech">'+(s.log[0]||'Frieza: „Pokaż mi, na co cię stać, Saiyaninie!”')+'</div></section><section class="battle-command"><div class="panel"><h2>Wybierz atak</h2><div class="grid">'+TECH.map(t=>btn(t.name+'<br><small>'+t.ki+' KI</small>','attack(\''+t.id+'\')',t.id==='meteor',s.ki<t.ki||s.enemy<=0||s.hp<=0)).join('')+btn('Obrona + KI','defend()')+btn('Nowa walka','reset()')+'</div></div><div class="panel log">'+s.log.slice(0,6).map(x=>'<div>• '+x+'</div>').join('')+'</div></section></div>');return}
if(s.screen==='scene'){let z=s.scene,t=TECH.find(q=>q.id===z.id),i=z.i,txt=t.frames[i];el(top('Sekwencja: '+t.name)+'<div class="panel">'+bars()+'</div>'+'<div class="scene-layout"><section>'+arena((z.id==='kame'&&i>=4?'beam':i>=t.frames.length-2?'impact':''))+'</section><section><div class="speech"><strong>STOPKLATKA '+(i+1)+'/'+t.frames.length+'</strong><p>'+txt+'</p></div><div class="panel"><div class="bar"><div class="fill ki" style="width:'+((i+1)/t.frames.length*100)+'%"></div></div><br>'+btn(i===t.frames.length-1?'Zakończ atak →':'Następna stopklatka →','nextFrame()',true)+'</div>');return}
if(s.screen==='skills'){el(top('Drzewko umiejętności')+nav()+'<div class="panel"><strong>LV '+s.level+' • XP '+s.xp+' • Punkty: '+s.sp+'</strong><p class="muted">Rozwijaj techniki po zwycięstwach.</p>'+[['atk','Moc uderzeń','+15% obrażeń ataków'],['def','Wytrzymałość','Mniej obrażeń od Friezy']].map(([k,n,d])=>'<div class="skill"><strong>'+n+' • '+s[k]+'/5</strong><p class="muted">'+d+'</p>'+btn('Ulepsz (1 pkt)','upgrade(\''+k+'\')',false,s.sp<=0||s[k]>=5)+'</div>').join('')+'<div class="skill"><strong>Instynkt przetrwania</strong><p class="muted">15% szans na unik kontrataku po silnym uderzeniu.</p><span class="pill">Pasywna</span></div></div>');return}
if(s.screen==='quests'){el(top('Dziennik zadań')+nav()+'<div class="panel">'+[['Pierwsze starcie','Rozpocznij walkę z Friezą'],['Wojownik KI','Użyj Kamehameha'],['Obrońca Namek','Pokonaj Friezę']].map((q,i)=>'<div class="skill"><strong>'+(s.quests[i]?'✓ ':'○ ')+q[0]+'</strong><p class="muted">'+q[1]+'</p></div>').join('')+'</div>');return}
if(s.screen==='world'){el(top('Planeta Namek')+nav()+'<div class="panel">'+arena()+'<h2>Skalista dolina</h2><p>Na horyzoncie widać statek Friezy. Wioska Nameczan potrzebuje pomocy.</p><div class="grid">'+btn('⚔ Walcz z Friezą','go(\'battle\')',true)+btn('📜 Dziennik zadań','go(\'quests\')')+btn('🌳 Rozwój postaci','go(\'skills\')')+btn('💾 Zapisz postęp','manualSave()')+'</div></div>');return}}
function manualSave(){save();alert('Zapisano postęp na tym urządzeniu.')}
function upgrade(k){if(s.sp>0&&s[k]<5){s.sp--;s[k]++;save();render()}}
function attack(id){const t=TECH.find(x=>x.id===id);if(!t||s.ki<t.ki||s.enemy<=0)return;s.ki-=t.ki;s.quests[0]=true;if(id==='kame')s.quests[1]=true;s.scene={id,i:0};s.screen='scene';render()}
function nextFrame(){const t=TECH.find(x=>x.id===s.scene.id);if(s.scene.i<t.frames.length-1){s.scene.i++;render();return}finishAttack(t)}
function finishAttack(t){if(t.id==='kaioken'){s.kai=3;s.log.unshift('Goku aktywuje Kaioken x2!')}else{let dmg=Math.round(t.power*(1+s.atk*.15)*(s.kai?1.65:1)*(0.85+Math.random()*.3));let dodge=Math.random()<.1;if(dodge){dmg=0;s.log.unshift('Frieza unika ataku przez błyskawiczny doskok!')}else{s.enemy=Math.max(0,s.enemy-dmg);s.log.unshift(t.name+': '+dmg+' obrażeń, '+t.hits+' trafień.')}if(s.kai)s.kai--;if(s.enemy>0&&Math.random()<.22){let bonus=Math.round(55*(1+s.atk*.15));s.enemy=Math.max(0,s.enemy-bonus);s.log.unshift('Pasywka: dodatkowy cios po kombinacji! -'+bonus+' HP')}}s.scene=null;if(s.enemy<=0){s.xp+=100;s.sp+=2;s.level++;s.quests[2]=true;s.log.unshift('ZWYCIĘSTWO! +100 XP, +2 punkty rozwoju.');save();s.screen='battle';render();return}enemyTurn()}
function enemyTurn(){if(Math.random()<.15){s.log.unshift('Instynkt przetrwania: Goku unika kontrataku!')}else{let dmg=Math.max(15,Math.round((70+Math.random()*75)*(1-s.def*.11)));s.hp=Math.max(0,s.hp-dmg);s.log.unshift('Frieza kontratakuje! Goku traci '+dmg+' HP.')}s.ki=Math.min(s.maxKi,s.ki+12);s.turn++;if(s.hp<=0){s.log.unshift('Goku przegrywa. Spróbuj ponownie!')}save();s.screen='battle';render()}
function defend(){s.ki=Math.min(s.maxKi,s.ki+28);s.hp=Math.min(s.maxHp,s.hp+25);s.log.unshift('Goku przyjmuje postawę obronną i regeneruje KI.');enemyTurn()}
try{render()}catch(error){console.error('Game initialization failed',error);A.innerHTML='<div class="panel"><h1>Dragon Ball New Age</h1><p>Nie udało się uruchomić gry.</p><p class="muted">Spróbuj otworzyć grę w Safari i odświeżyć stronę.</p><button class="btn primary" onclick="location.reload()">Odśwież grę</button></div>'}
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline mode unavailable:',err)))}
</script></body></html>
