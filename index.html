<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b142a">
<title>Dragon Ball New Age — Demo 0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 16% 4%,#204962,#0b1329 68%);color:#f1f6ff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}#app{max-width:1120px;margin:auto;padding:20px 16px 70px}.brand{font-size:clamp(22px,4vw,38px);font-weight:1000;color:#ffce5d;letter-spacing:1px;text-shadow:0 4px #403020}.sub{font-size:12px;letter-spacing:2px;color:#bad5fa;font-weight:800}.card{background:#14243de8;border:1px solid #536a82;border-radius:18px;padding:18px;margin:13px 0;box-shadow:0 10px 28px #0004}.hero{min-height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(160deg,#174d5c 0%,#294966 35%,#202c46 55%,#0e1d36 100%);border-radius:15px;border:2px solid #6293a3;overflow:hidden}.hero .planet{font-size:90px;filter:drop-shadow(0 12px 12px #0006)}.hero .fighters{font-size:90px;line-height:1.4;letter-spacing:12px;filter:drop-shadow(0 8px 10px #0008)}.hero .effects{font-size:58px;line-height:1.1}.hero small{background:#101a2bd9;padding:7px 14px;border-radius:40px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.btn{background:#244160;border:1px solid #7398b9;color:#fff;border-radius:12px;min-height:50px;padding:10px 13px;text-align:center;font-weight:750}.btn.gold{background:#ffca5d;color:#1b2637;border-color:#ffe9b0}.btn:active{transform:scale(.98)}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.small{font-size:13px;color:#bad0e5}.title{font-weight:900;font-size:20px;margin:0 0 9px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.nav .btn{min-height:38px;padding:7px 12px;font-size:13px}.nav .selected{background:#ffca5d;color:#18263b}.columns{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bar{height:12px;border-radius:12px;background:#27364b;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,#bd3d56,#ff8b68)}.blue{background:linear-gradient(90deg,#2372a8,#65e2ff)}.log{font-size:13px;line-height:1.55;max-height:150px;overflow-y:auto}.log div{padding:5px 0;border-bottom:1px solid #ffffff19}.note{font-size:13px;color:#dceafb}.scene-text{font-size:19px;line-height:1.5;min-height:95px}.counter{color:#ffcd62;font-weight:900}.tag{display:inline-block;padding:7px 11px;background:#35567a;border-radius:20px;color:#fff;font-size:12px}@media(max-width:650px){.columns{grid-template-columns:1fr}.hero{min-height:220px}.hero .fighters{font-size:67px}.hero .planet{font-size:73px}.card{padding:13px}.brand{font-size:25px}}@media(orientation:landscape){#app{padding-top:8px}.hero{min-height:175px}.hero .planet{font-size:65px}}
</style></head><body>
<main id="app">
<section class="card"><div class="sub">GRYWALNY PROTOTYP • 0.2</div><h1 class="brand">DRAGON BALL NEW AGE</h1><div class="hero"><div class="planet">🪐</div><strong>PLANETA NAMEK</strong><small>Prolog • Goku kontra Frieza</small></div>
<div class="actions"><button class="btn gold" data-go="battle">⚔ NOWA WALKA</button><button class="btn" data-go="world">🌍 EKSPLORUJ</button></div>
<p class="small">Ta wersja działa bez zewnętrznych bibliotek i nie wymaga logowania.</p></section>
</main>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var moves=[
{id:'punch',name:'Szybkie ciosy',cost:0,damage:145,shots:['Goku ustawia się do walki.','Doskok! Pierwsza pięść trafia Friezę.','Seria trzech ciosów!','Frieza zostaje odrzucony na skały.']},
{id:'ki',name:'Fala KI',cost:15,damage:230,shots:['Goku unosi dłoń.','Niebieska energia skupia się w ręce.','Fala KI przelatuje przez arenę!','Eksplozja odrzuca przeciwnika.']},
{id:'meteor',name:'Meteor Combo',cost:25,damage:325,shots:['Goku rozpoczyna szarżę!','Teleport za przeciwnika!','Kombinacja pięści i kopnięć.','Frieza przebija skałę!','Meteor Smash — trafienie!']},
{id:'kame',name:'Kamehameha',cost:40,damage:470,shots:['Ka...','Me...','Ha... Me...','HAAAA!','Potężna fala energii przemierza dolinę Namek!','Frieza zostaje trafiony eksplozją!']}
];
function fresh(){return {screen:'home',hp:1250,maxHp:1250,ki:100,maxKi:100,enemy:1800,maxEnemy:1800,level:1,xp:0,points:0,power:0,armor:0,turn:1,stage:0,active:null,log:['Frieza: To tutaj kończy się twoja podróż!']};}
var state=fresh();
try{var raw=localStorage.getItem('dbna-standalone-save-v2');if(raw){var saved=JSON.parse(raw);if(saved && typeof saved.hp==='number'){state=Object.assign(fresh(),saved,{screen:'home',active:null});}}}catch(ignore){}
function persist(){try{localStorage.setItem('dbna-standalone-save-v2',JSON.stringify(Object.assign({},state,{screen:'home',active:null})));}catch(ignore){}}
function clamp(n){return Math.max(0,Math.min(100,Math.round(n)));}
function meter(v,max,cls){return '<div class="bar"><div class="fill '+(cls||'')+'" style="width:'+clamp(v/max*100)+'%"></div></div>';}
function button(label,action,value,gold,disabled){return '<button class="btn '+(gold?'gold':'')+'" data-action="'+action+'" data-value="'+(value||'')+'" '+(disabled?'disabled':'')+'>'+label+'</button>';}
function header(title){return '<div class="sub">DRAGON BALL NEW AGE • DEMO 0.2</div><div class="topline"><h1 class="brand">'+title+'</h1><span class="tag">iPHONE / RPG</span></div>';}
function nav(){return '<div class="nav">'+[['home','Start'],['world','Namek'],['battle','Walka'],['skills','Rozwój']].map(function(x){return '<button class="btn '+(state.screen===x[0]?'selected':'')+'" data-go="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>';}
function art(style){var e=style==='blast'?'💥':style==='ki'?'🔵':'⚡';return '<div class="hero"><div class="fighters">🥋 '+e+' 👾</div><small>Skalista dolina • Namek</small></div>';}
function stats(){return '<div class="stats"><div><b>GOKU • LV '+state.level+'</b><div class="small">HP '+state.hp+' / '+state.maxHp+'</div>'+meter(state.hp,state.maxHp)+'<div class="small">KI '+state.ki+' / '+state.maxKi+'</div>'+meter(state.ki,state.maxKi,'blue')+'</div><div><b>FRIEZA</b><div class="small">HP '+state.enemy+' / '+state.maxEnemy+'</div>'+meter(state.enemy,state.maxEnemy)+'<div class="small">Tura '+state.turn+'</div></div></div>';}
function render(){
var s=state.screen;
if(s==='home'){app.innerHTML='<section class="card">'+header('DRAGON BALL NEW AGE')+'<div class="hero"><div class="planet">🪐</div><h2>PROLOG: PLANETA NAMEK</h2><small>Pierwsza grywalna wersja przeglądarkowa</small></div><div class="actions">'+button('⚔ NOWA WALKA','new','','gold')+button('🌍 EKSPLORUJ','goto','world')+'</div><p class="small">Walka turowa • kadry ataków • EXP • rozwój wojownika</p></section>';return;}
if(s==='world'){app.innerHTML='<section class="card">'+header('PLANETA NAMEK')+nav()+art()+'<h2>Skalista dolina</h2><p>Przed tobą rozległa dolina. Na horyzoncie widać oddziały Friezy. Wybierz dokąd ruszyć.</p><div class="actions">'+button('⚔ Walcz z Friezą','goto','battle','gold')+button('💪 Trening KI (+20 KI)','train')+button('🌳 Rozwój wojownika','goto','skills')+button('💾 Zapisz postęp','save')+'</div></section>';return;}
if(s==='battle'){app.innerHTML=header('WALKA NA NAMEK')+nav()+'<section class="card">'+stats()+'</section><div class="columns"><section class="card">'+art()+'<p class="note">'+(state.hp<=0?'Goku został pokonany. Rozpocznij nową walkę.':state.enemy<=0?'ZWYCIĘSTWO! Frieza został pokonany.':'Wybierz technikę. Obrażenia zostaną policzone po sekwencji kadrów.')+'</p></section><section class="card"><h2 class="title">TWOJE RUCHY</h2><div class="actions">'+moves.map(function(m){return button(m.name+'<br><small>'+m.cost+' KI</small>','attack',m.id,m.id==='kame',state.ki<m.cost||state.hp<=0||state.enemy<=0);}).join('')+button('🛡 Obrona + KI','defend','',false,state.hp<=0||state.enemy<=0)+button('↻ Nowa walka','new')+'</div><div class="log">'+state.log.slice(0,5).map(function(x){return '<div>• '+x+'</div>';}).join('')+'</div></section></div>';return;}
if(s==='scene'){var move=moves.filter(function(x){return x.id===state.active;})[0];if(!move){state.screen='battle';render();return;}var i=state.stage;app.innerHTML=header(move.name)+'<section class="card">'+stats()+'</section><div class="columns"><section class="card">'+art(i>=move.shots.length-2?'blast':'ki')+'</section><section class="card"><div class="counter">KADR '+(i+1)+' / '+move.shots.length+'</div><p class="scene-text">'+move.shots[i]+'</p>'+meter(i+1,move.shots.length,'blue')+button(i===move.shots.length-1?'ZAKOŃCZ ATAK →':'NASTĘPNY KADR →','next','','gold')+'</section></div>';return;}
if(s==='skills'){app.innerHTML='<section class="card">'+header('ROZWÓJ WOJOWNIKA')+nav()+'<h2>Poziom '+state.level+' • XP '+state.xp+' • Punkty '+state.points+'</h2><p>Każde zwycięstwo daje punkty do rozwoju.</p><div class="actions">'+button('🥊 Siła '+state.power+'/5','upgrade','power',true,state.points===0||state.power>=5)+button('🛡 Obrona '+state.armor+'/5','upgrade','armor',false,state.points===0||state.armor>=5)+button('⚔ Wróć do walki','goto','battle')+button('💾 Zapisz','save')+'</div><p class="small">Podstawowe drzewko; pełne podskille dodamy w kolejnej wersji.</p></section>';return;}
}
function startFight(){var progress={level:state.level,xp:state.xp,points:state.points,power:state.power,armor:state.armor};state=Object.assign(fresh(),progress,{screen:'battle'});persist();render();}
function attack(id){var m=moves.filter(function(x){return x.id===id;})[0];if(!m||state.ki<m.cost||state.hp<=0||state.enemy<=0)return;state.ki-=m.cost;state.active=id;state.stage=0;state.screen='scene';render();}
function next(){var m=moves.filter(function(x){return x.id===state.active;})[0];if(!m)return;if(state.stage<m.shots.length-1){state.stage++;render();return;}var damage=Math.round(m.damage*(1+state.power*.18));state.enemy=Math.max(0,state.enemy-damage);state.log.unshift(m.name+': -'+damage+' HP!');state.active=null;state.screen='battle';if(state.enemy===0){state.level++;state.xp+=100;state.points+=2;state.log.unshift('ZWYCIĘSTWO! +100 XP, +2 punkty.');}else{foeTurn();}persist();render();}
function foeTurn(){var damage=Math.max(12,Math.round((70+Math.random()*55)*(1-state.armor*.12)));state.hp=Math.max(0,state.hp-damage);state.ki=Math.min(state.maxKi,state.ki+12);state.turn++;state.log.unshift('Frieza kontratakuje: -'+damage+' HP!');}
app.addEventListener('click',function(event){var b=event.target.closest('button');if(!b||!app.contains(b)||b.disabled)return;var go=b.getAttribute('data-go');if(go){state.screen=go;render();return;}var action=b.getAttribute('data-action'),value=b.getAttribute('data-value');if(action==='new')startFight();else if(action==='goto'){state.screen=value;render();}else if(action==='attack')attack(value);else if(action==='next')next();else if(action==='defend'){state.ki=Math.min(state.maxKi,state.ki+30);state.hp=Math.min(state.maxHp,state.hp+20);state.log.unshift('Obrona i regeneracja KI');foeTurn();persist();render();}else if(action==='train'){state.ki=Math.min(state.maxKi,state.ki+20);persist();render();}else if(action==='upgrade'&&state.points>0&&state[value]<5){state.points--;state[value]++;persist();render();}else if(action==='save'){persist();state.log.unshift('Zapisano postęp');render();}});
render();
})();
</script></body></html>
