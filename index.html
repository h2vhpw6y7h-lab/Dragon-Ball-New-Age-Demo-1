/* Anime illustration layer — replaces the temporary geometric fighters. */
.cinematic-arena{position:relative;isolation:isolate;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:2px solid #75c7e5;background:linear-gradient(145deg,#005f77 5%,#249eb3 43%,#85704b 100%);box-shadow:0 18px 36px #0006}

ki:['https://genk.mediacdn.vn/2019/9/14/photo-1-15684510731982007283836.png','https://imagenes.hobbyconsolas.com/files/image_1920_1080/uploads/imagenes/2023/04/25/69026f56d6d7f.jpeg','https://imagenes.hobbyconsolas.com/files/image_1920_1080/uploads/imagenes/2023/04/25/69026f56d6d7f.jpeg','https://dble.bn-ent.net/shared/img/kv_frieza.webp'],
kame:['https://genk.mediacdn.vn/2019/9/14/photo-1-15684510731982007283836.png','https://genk.mediacdn.vn/2019/9/14/photo-1-15684510731982007283836.png','https://imagenes.hobbyconsolas.com/files/image_1920_1080/uploads/imagenes/2023/04/25/69026f56d6d7f.jpeg','https://imagenes.hobbyconsolas.com/files/image_1920_1080/uploads/imagenes/2023/04/25/69026f56d6d7f.jpeg','https://images.plex.tv/photo?scale=1&size=large-1280&url=https%3A%2F%2Fimage.tmdb.org%2Ft%2Fp%2Foriginal%2Fw7mH75Cf0OsqubBNMJ741pAGoKQ.jpg','https://dble.bn-ent.net/shared/img/kv_frieza.webp']
};
function sceneArt(move,i){
var src=(cutImages[move.id]||cutImages.punch)[i];
var kind=i===move.shots.length-1?'explosion':(move.id==='punch'||move.id==='meteor')?(i===1?'vanish':'impact'):(i<3?'charge':'impact');
var fallback='https://dble.bn-ent.net/shared/img/kv_frieza.webp';
return '<div class="scene-shot cut-'+kind+'"><img loading="eager" alt="Kadr '+(i+1)+' ataku '+move.name+'" src="'+src+'" onerror="this.onerror=null;this.src=\''+fallback+'\'"><div class="scene-fx"></div><div class="scene-mask"></div><div class="scene-caption"><strong>NAMEK • '+move.name.toUpperCase()+'</strong><strong>'+('0'+(i+1)).slice(-2)+' / '+('0'+move.shots.length).slice(-2)+'</strong></div></div>';
}
function stats(){return '<div class="stats"><div><b>GOKU • LV '+state.level+'</b><div class="small">HP '+state.hp+' / '+state.maxHp+'</div>'+meter(state.hp,state.maxHp)+'<div class="small">KI '+state.ki+' / '+state.maxKi+'</div>'+meter(state.ki,state.maxKi,'blue')+'</div><div><b>FRIEZA</b><div class="small">HP '+state.enemy+' / '+state.maxEnemy+'</div>'+meter(state.enemy,state.maxEnemy)+'<div class="small">Tura '+state.turn+'</div></div></div>';}
function render(){
var s=state.screen;
if(s==='home'){
app.innerHTML=header('DRAGON BALL NEW AGE')+
'<div class="main-menu-cover">'+art()+'<div class="main-menu-caption"><span class="tag">RPG • PROLOG</span><strong>WOJNA O NAMEK</strong><span>Ataki, transformacje i taktyka — pierwsza grywalna misja Dragon Ball New Age.</span></div></div>'+
'<div class="status-pills"><span>LV '+state.level+'</span><span>EXP '+state.xp+'</span><span>KI '+state.ki+'</span><span>Punkty '+state.points+'</span></div>'+
'<div class="menu-grid">'+
'<button class="menu-tile goldtile" data-action="new"><span class="menu-icon">⚔️</span><strong>NOWA WALKA</strong><small>Rozpocznij starcie z Friezą</small></button>'+
'<button class="menu-tile" data-action="goto" data-value="battle"><span class="menu-icon">▶</span><strong>KONTYNUUJ</strong><small>Wróć do walki</small></button>'+
'<button class="menu-tile" data-action="goto" data-value="world"><span class="menu-icon">🌍</span><strong>PLANETA NAMEK</strong><small>Eksploracja i trening KI</small></button>'+
'<button class="menu-tile" data-action="goto" data-value="skills"><span class="menu-icon">🌳</span><strong>UMIEJĘTNOŚCI</strong><small>Drzewko skilli i pasywów</small></button></div>'+
'<p class="small">Wersja testowa • zapis lokalny na urządzeniu • zaprojektowana dla iPhone’a</p>';return;}
if(s==='world'){
app.innerHTML=header('PLANETA NAMEK')+nav()+'<section class="card">'+art()+'<h2>Skalista dolina</h2><p>W oddali widać statek Friezy. Możesz wrócić do walki albo trenować, zanim stawisz czoła przeciwnikowi.</p>'+
'<div class="world-places">'+
'<div class="place"><h3>⛰️ Skalna dolina</h3><p class="small">Boss: Frieza</p>'+button('⚔ Walka','goto','battle',true)+'</div>'+
'<div class="place"><h3>🌀 Trening KI</h3><p class="small">Regeneracja +20 KI</p>'+button('Trenuj','train')+'</div>'+
'<div class="place"><h3>🌳 Drzewko skilli</h3><p class="small">Pasywy, siła, obrona</p>'+button('Ulepsz','goto','skills')+'</div>'+
'<div class="place"><h3>💾 Zapis</h3><p class="small">Zachowaj postępy</p>'+button('Zapisz','save')+'</div></div></section>';return;}
if(s==='battle'){
var tabs=[['all','⚔ Wszystko'],['physical','🥊 Ciosy'],['ki','🔵 KI'],['combo','💥 Combo']];
var selected=state.tab||'all',filtered=moves.filter(function(m){return selected==='all'||m.type===selected;});
var cards=filtered.map(function(m){
var locked=state.ki<Math.max(0,m.cost-((m.type==='ki')?(state.kiControl||0)*2:0))||state.hp<=0||state.enemy<=0;
return '<button class="tech '+(m.id==='kame'?'ultimate':'')+'" data-action="attack" data-value="'+m.id+'" '+(locked?'disabled':'')+'><span class="tech-icon">'+m.icon+'</span><strong>'+m.name+'</strong><em>'+m.desc+'</em><small>'+m.cost+' KI • opanowanie '+(state.mastery[m.id]||0)+'</small></button>';}).join('');
app.innerHTML=header('WALKA NA NAMEK')+nav()+
'<section class="card">'+stats()+'<div class="combo-meter"><span>COMBO '+(state.comboMeter||0)+'%</span>'+meter(state.comboMeter||0,100)+'</div></section>'+
'<div class="columns"><section class="card">'+art()+
'<p class="note">'+(state.hp<=0?'Goku przegrał — rozpocznij nowe starcie.':state.enemy<=0?'ZWYCIĘSTWO! Frieza został pokonany.':'Wybierz technikę. W trakcie sekwencji kadrowej HP pozostaje bez zmian.')+'</p></section>'+
'<section class="card"><h2 class="title">MENU WALKI</h2><div class="command-tabs">'+tabs.map(function(t){return '<button class="command-tab '+(selected===t[0]?'on':'')+'" data-action="tab" data-value="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>'+
'<div class="tech-grid">'+cards+'</div><div class="actions">'+
button('🛡 Obrona +KI','defend','',false,state.hp<=0||state.enemy<=0)+button('↻ Nowa walka','new')+
'</div><div class="log">'+state.log.slice(0,5).map(function(x){return '<div>• '+x+'</div>';}).join('')+'</div></section></div>';return;}
if(s==='scene'){var move=moves.filter(function(x){return x.id===state.active;})[0];if(!move){state.screen='battle';render();return;}var i=state.stage;app.innerHTML=header(move.name)+'<section class="card">'+stats()+'</section><div class="columns"><section class="card">'+sceneArt(move,i)+'</section><section class="card"><div class="counter">KADR '+(i+1)+' / '+move.shots.length+'</div><p class="scene-text">'+move.shots[i]+'</p>'+meter(i+1,move.shots.length,'blue')+button(i===move.shots.length-1?'ZAKOŃCZ ATAK →':'NASTĘPNY KADR →','next','','gold')+'</section></div>';return;}
if(s==='skills'){
var branches=[
{id:'power',icon:'🥊',title:'Siła',route:'ATAK • ATRYBUT',desc:'+18% obrażeń za poziom',max:5},
{id:'armor',icon:'🛡️',title:'Wytrzymałość',route:'OBRONA • PASYW',desc:'Mniej obrażeń od przeciwników',max:5},
{id:'focus',icon:'🎯',title:'Koncentracja',route:'KI • PASYW',desc:'+8% obrażeń technik energii',max:5},
{id:'kiControl',icon:'🔵',title:'Kontrola KI',route:'ENERGIA • PODSKILL',desc:'Koszt technik KI niższy o 2',max:5}
];
app.innerHTML=header('DRZEWKO UMIEJĘTNOŚCI')+nav()+
'<section class="card"><div class="topline"><h2 class="title">LV '+state.level+' • XP '+state.xp+'</h2><span class="tag">'+state.points+' PUNKTÓW</span></div><p class="small">Wybierz ścieżkę. Pasywy, atrybuty i opanowanie ataków rozwijają się osobno.</p>'+
'<div class="skill-layout">'+branches.map(function(s){
var n=state[s.id]||0;
return '<div class="skill-node"><div class="skill-icon">'+s.icon+'</div><div class="skill-branch">'+s.route+'</div><h3>'+s.title+'</h3><p>'+s.desc+'</p>'+meter(n,s.max,'blue')+'<div class="skill-progress"><span>STOPIEŃ '+n+' / '+s.max+'</span><span>1 pkt</span></div>'+
button('Ulepsz','upgrade',s.id,s.id==='power',n>=s.max||state.points<=0)+'</div>';}).join('')+'</div>'+
'<div class="skill-section"><h2 class="title">TECHNIKI I PODSKILLE</h2><p class="small">Każde użycie ataku podnosi jego opanowanie. Co 10 użyć — +5% do jego obrażeń.</p>'+
'<div class="skill-mini-grid">'+moves.map(function(m){
var n=(state.mastery&&state.mastery[m.id])||0;
return '<div class="skill-mini"><b>'+m.icon+' '+m.name+'</b><div class="skill-progress"><span>UŻYCIA '+n+'</span><span>RANGA '+Math.floor(n/10)+'</span></div>'+meter(n%10,10,'blue')+'</div>';}).join('')+'</div></div>'+
'<div class="skill-section"><h2 class="title">POŁĄCZENIA TECHNIK</h2><p class="small">🥊 Ciosy budują miernik Combo. 💥 Meteor Combo zużywa zgromadzoną serię i dostaje bonus obrażeń. 🔵 Kontrola KI zmniejsza koszt Kamehameha i Fali KI.</p></div>'+
'<div class="actions">'+button('⚔ Wróć do walki','goto','battle',true)+button('💾 Zapisz postęp','save')+'</div></section>';return;}
}
function startFight(){var progress={level:state.level,xp:state.xp,points:state.points,power:state.power,armor:state.armor,focus:state.focus||0,kiControl:state.kiControl||0,mastery:state.mastery||{punch:0,ki:0,meteor:0,kame:0}};state=Object.assign(fresh(),progress,{screen:'battle'});persist();render();}
function attack(id){var m=moves.filter(function(x){return x.id===id;})[0];if(!m||state.hp<=0||state.enemy<=0)return;var actualCost=Math.max(0,m.cost-((m.type==='ki')?(state.kiControl||0)*2:0));if(state.ki<actualCost)return;state.ki-=actualCost;state.active=id;state.stage=0;state.screen='scene';render();}
function next(){var m=moves.filter(function(x){return x.id===state.active;})[0];if(!m)return;if(state.stage<m.shots.length-1){state.stage++;render();return;}var uses=state.mastery[m.id]||0;var masteryBonus=1+Math.floor(uses/10)*.05;var comboBonus=m.type==='combo'?1+(state.comboMeter||0)/200:1;var focusBonus=m.type==='ki'?1+(state.focus||0)*.08:1;var damage=Math.round(m.damage*(1+state.power*.18)*masteryBonus*comboBonus*focusBonus);state.mastery[m.id]=uses+1;state.comboMeter=m.type==='physical'?Math.min(100,(state.comboMeter||0)+25):m.type==='combo'?0:Math.max(0,(state.comboMeter||0)-10);state.enemy=Math.max(0,state.enemy-damage);state.log.unshift(m.name+': -'+damage+' HP!');state.active=null;state.screen='battle';if(state.enemy===0){state.level++;state.xp+=100;state.points+=2;state.log.unshift('ZWYCIĘSTWO! +100 XP, +2 punkty.');}else{foeTurn();}persist();render();}
function foeTurn(){var damage=Math.max(12,Math.round((70+Math.random()*55)*(1-state.armor*.12)));state.hp=Math.max(0,state.hp-damage);state.ki=Math.min(state.maxKi,state.ki+12);state.turn++;state.log.unshift('Frieza kontratakuje: -'+damage+' HP!');}
app.addEventListener('click',function(event){var b=event.target.closest('button');if(!b||!app.contains(b)||b.disabled)return;var go=b.getAttribute('data-go');if(go){state.screen=go;render();return;}var action=b.getAttribute('data-action'),value=b.getAttribute('data-value');if(action==='tab'){state.tab=value;render();}else if(action==='new')startFight();else if(action==='goto'){state.screen=value;render();}else if(action==='attack')attack(value);else if(action==='next')next();else if(action==='defend'){state.ki=Math.min(state.maxKi,state.ki+30);state.hp=Math.min(state.maxHp,state.hp+20);state.log.unshift('Obrona i regeneracja KI');foeTurn();persist();render();}else if(action==='train'){state.ki=Math.min(state.maxKi,state.ki+20);persist();render();}else if(action==='upgrade'&&state.points>0&&['power','armor','focus','kiControl'].indexOf(value)>=0&&(state[value]||0)<5){state.points--;state[value]=(state[value]||0)+1;persist();render();}else if(action==='save'){persist();state.log.unshift('Zapisano postęp');render();}});
render();
})();
</script></body></html>
